name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check tag matches package version
        run: |
          version=$(dotnet msbuild src/TradeRouter/TradeRouter.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore TradeRouter.Net.slnx -m:1 -nr:false

      - name: Build
        run: dotnet build TradeRouter.Net.slnx -c Release --no-restore -m:1 -nr:false

      - name: Test .NET 8 and .NET 10
        run: dotnet test tests/TradeRouter.Tests/TradeRouter.Tests.csproj -c Release --no-build -m:1 -nr:false

      - name: Pack
        run: dotnet pack src/TradeRouter/TradeRouter.csproj -c Release --no-build -m:1 -nr:false -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: TradeRouter.Net-package
          path: artifacts/*
          if-no-files-found: error

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
